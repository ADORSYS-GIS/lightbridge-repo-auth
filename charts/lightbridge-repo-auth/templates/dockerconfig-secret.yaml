{{- with .Values.imagePullSecret }}
{{- if .enabled }}
# ghcr.io pull Secret (dockerconfigjson) for the PRIVATE image package. Built by
# ESO from the github_username / github_token props in ssegning-aws. The ESO
# template braces are emitted via a Go raw-string ({{ `...` }}) so Helm passes
# `{{ .username }}` etc. through literally for ESO to evaluate (un-escaped braces
# would be eaten by Helm's own templating).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  labels:
    {{- include "lra.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.externalSecret.storeRef }}
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {{ `{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}` }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey }}
        property: {{ .usernameProp }}
    - secretKey: token
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey }}
        property: {{ .tokenProp }}
{{- end }}
{{- end }}

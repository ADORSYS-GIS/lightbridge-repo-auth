image:
  repository: ghcr.io/adorsys-gis/lightbridge-repo-auth
  # Empty → chart appVersion. Pin per release in the consuming Application.
  tag: ""
  pullPolicy: IfNotPresent

# Pull Secret for the PRIVATE ghcr package. ESO builds a dockerconfigjson from
# the github_username / github_token props in ssegning-aws (externalSecret.remoteKey).
imagePullSecret:
  enabled: true
  secretName: lightbridge-repo-auth-ghcr
  usernameProp: github_username
  tokenProp: github_token

replicas: 2

service:
  port: 3000

database:
  # CNPG-managed role Secret (basic-auth: username + password), provisioned in
  # ai-helm charts/lightbridge-db next to the cluster. We read `password` from it.
  roleSecretName: repo-auth-db-role

# Public webhook ingress (Traefik). Only the /github surface is exposed; the
# TLS Secret is provisioned by the app's deps overlay Certificate (ADR-0018),
# so no cert-manager annotation lives here. Disabled by default — enable in the
# consuming Application's valuesObject once the deps overlay + DNS exist.
ingress:
  enabled: false
  className: traefik
  host: repo-auth.ai.camer.digital
  path: /github
  # tlsSecretName: defaults to "<host>-tls"
  annotations: {}

# Non-secret env. Secret values come from the ExternalSecret below.
env:
  RA__SERVER__BIND: "0.0.0.0:3000"
  # Numeric GitHub App id from the manifest conversion — public, not a secret.
  RA__GITHUB__APP_ID: "000000"
  RA__GITHUB__API_BASE: "https://api.github.com"
  # Postgres via CNPG: a `repoauth` database + managed role on the existing
  # lightbridge-main-db cluster (ai-helm charts/lightbridge-db). Host/port/name/
  # user are non-secret; only the password is injected from the role Secret.
  RA__DATABASE__HOST: "lightbridge-main-db-rw.converse.svc.cluster.local"
  RA__DATABASE__PORT: "5432"
  RA__DATABASE__NAME: "repoauth"
  RA__DATABASE__USER: "repoauth"
  RA__DATABASE__SSLMODE: "disable"
  # The base every Source audience is built from: <base>/sources/<source_id>.
  RA__SOURCE__AUDIENCE_BASE: "https://api.ai.camer.digital"
  RA__GITHUB__PRIVATE_KEY_PATH: "/etc/github-app/private-key.pem"
  RA__RECONCILE__INTERVAL_SECS: "900"
  RUST_LOG: "info"

# ESO-provisioned secret (ClusterSecretStore `ssegning-aws`). Maps remote
# properties → the env vars + the mounted App private key. Adjust remoteKey /
# property names to your secret layout (ai-helm convention: ai/camer/digital/prod/env).
externalSecret:
  enabled: true
  storeRef: ssegning-aws
  refreshInterval: 1h
  remoteKey: ai/camer/digital/prod/env
  props:
    webhookSecret: repo_auth_github_webhook_secret
    internalToken: repo_auth_resolve_internal_token
    privateKeyPem: repo_auth_github_private_key_pem

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  # distroless `nonroot` declares USER by NAME, which the kubelet can't verify
  # against runAsNonRoot — pin the numeric UID/GID (65532 = distroless nonroot).
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
